<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오독오독 호스트</title>
<meta name="description" content="클래스를 만들고 작품을 배포하며 게스트 제출현황을 보는 호스트 보드">
<meta name="theme-color" content="#FF6B5A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오독 호스트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{
  color-scheme: light;
  --bg:#FFF3E4; --bg2:#FFE6CC; --card:#FFFFFF; --ink:#231C3D; --muted:#6D6689;
  --coral:#FF6B5A; --coral-d:#D9483A; --lemon:#FFD84D; --lemon-d:#E0AE00; --mint:#23BF98; --mint-d:#11917A;
  --sky:#4DA3FF; --sky-d:#2474D1; --lilac:#8E6CFF; --lilac-d:#6446D6; --pink:#FF6FA3; --pink-d:#D9437A; --orange:#FFA64D;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --line:2.5px solid var(--ink);
  --pop:0 6px 0 var(--ink),0 14px 26px rgba(35,28,61,.16);
  --pop-sm:0 4px 0 var(--ink),0 8px 14px rgba(35,28,61,.14);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 8% -8%,rgba(255,111,163,.20),transparent 60%),
    radial-gradient(800px 560px at 105% 10%,rgba(77,163,255,.20),transparent 60%),
    radial-gradient(900px 600px at 50% 115%,rgba(35,191,152,.18),transparent 60%),
    radial-gradient(rgba(35,28,61,.08) 1.2px,transparent 1.4px) 0 0/14px 14px,
    var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:grid;gap:12px}
[hidden]{display:none!important}

/* ---------- 3D 기본 조각 ---------- */
.card{background:var(--card);border:var(--line);border-radius:22px;box-shadow:var(--pop);padding:18px}
.btn{position:relative;font-family:var(--ui);font-size:16px;border:var(--line);border-radius:14px;background:var(--card);padding:9px 16px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;
  background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.coral{background-color:var(--coral);color:#fff}
.btn.lemon{background-color:var(--lemon)}
.btn.mint{background-color:var(--mint);color:#fff}
.btn.sky{background-color:var(--sky);color:#fff}
.btn.lilac{background-color:var(--lilac);color:#fff}
.btn.pink{background-color:var(--pink);color:#fff}
.btn.ink{background-color:var(--ink);color:#fff}
.btn.big{font-size:20px;padding:13px 22px;border-radius:18px}
.btn.sm{font-size:14px;padding:5px 11px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn.sm:active{transform:translateY(3px)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.45;pointer-events:none}
.fld{display:grid;gap:5px;font-family:var(--ui);font-size:14px}
input.in,select.in,textarea.in{width:100%;border:var(--line);border-radius:14px;padding:10px 13px;background:#fff;font-family:var(--body);font-size:16px;
  box-shadow:inset 0 3px 0 rgba(35,28,61,.08);transition:box-shadow .15s,background .15s}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;background:#FFFDF5;box-shadow:inset 0 3px 0 rgba(35,28,61,.08),0 0 0 4px rgba(77,163,255,.35)}
textarea.in{resize:vertical;line-height:1.6}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--ui);font-size:13px;border:2px solid var(--ink);border-radius:9px;padding:0 8px;background:var(--lemon);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160%);background:var(--ink);color:#fff;
  font-family:var(--ui);padding:11px 20px;border-radius:16px;z-index:120;transition:transform .25s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- 3D 로고 ---------- */
.logo{display:inline-flex;gap:.02em;font-family:var(--display);font-size:clamp(52px,14vw,104px);line-height:1;letter-spacing:.02em}
.logo span{display:inline-block;color:var(--lemon);-webkit-text-stroke:2.5px var(--ink);
  text-shadow:1px 1px 0 var(--coral),2px 2px 0 var(--coral),3px 3px 0 var(--coral),4px 4px 0 var(--coral),5px 5px 0 var(--coral-d),6px 6px 0 var(--coral-d),7px 7px 0 var(--coral-d),8px 8px 0 var(--ink),9px 10px 0 var(--ink),10px 16px 18px rgba(35,28,61,.25);
  animation:crunch 2.6s ease-in-out infinite}
.logo span:nth-child(2){color:#9FE9D4;animation-delay:.15s}
.logo span:nth-child(3){color:#FFC2DA;animation-delay:.3s}
.logo span:nth-child(4){color:#BFD9FF;animation-delay:.45s}
@keyframes crunch{0%,70%,100%{transform:translateY(0) rotate(0)}78%{transform:translateY(-8px) rotate(-4deg)}86%{transform:translateY(0) rotate(3deg) scale(1.04,.94)}}
.logo.sm{font-size:30px}
.logo.sm span{-webkit-text-stroke:1.5px var(--ink);text-shadow:1px 1px 0 var(--coral),2px 2px 0 var(--coral-d),3px 3px 0 var(--ink),4px 4px 0 var(--ink);animation:none}
.tagline{font-family:var(--ui);font-size:17px;margin:0}

/* ---------- 캐릭터 (광택 구슬) ---------- */
.av{--c:#FFD84D;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:0 0 auto;border:2.5px solid var(--ink);
  background:radial-gradient(circle at 32% 28%,#fff 0 8%,color-mix(in srgb,var(--c) 55%,#fff) 22%,var(--c) 58%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:0 4px 0 var(--ink),inset -4px -6px 10px rgba(0,0,0,.12)}
.av span{font-size:24px;line-height:1;filter:drop-shadow(0 2px 0 rgba(35,28,61,.25))}
.av.sm{width:34px;height:34px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.av.sm span{font-size:18px}
.av.lg{width:64px;height:64px}
.av.lg span{font-size:36px}
.av.xl{width:120px;height:120px;border-width:3px;box-shadow:0 8px 0 var(--ink),0 18px 30px rgba(35,28,61,.25),inset -8px -12px 20px rgba(0,0,0,.14)}
.av.xl span{font-size:68px}

/* ---------- 별 ---------- */
.stars-s{display:inline-flex;gap:1px;font-size:17px;letter-spacing:0}
.stars-s i{font-style:normal;color:#E3DDF0;-webkit-text-stroke:1px rgba(35,28,61,.35)}
.stars-s i.on{color:#FFC62E;-webkit-text-stroke:1px var(--ink)}

/* ---------- 입체 큐브 ---------- */
.cube3d{--s:76px;display:inline-block;width:var(--s);height:var(--s);perspective:600px;flex:0 0 auto}
.cube3d .cb{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;animation:cubespin 10s linear infinite}
.cube3d i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:calc(var(--s) * .46);color:var(--ink);
  border:2.5px solid var(--ink);border-radius:14px;background-image:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);box-shadow:inset -4px -6px 0 rgba(0,0,0,.1)}
.cube3d i:nth-child(1){transform:translateZ(calc(var(--s) / 2));background-color:#FFD84D}
.cube3d i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s) / 2));background-color:#9FE9D4}
.cube3d i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s) / 2));background-color:#FFC2DA}
.cube3d i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s) / 2));background-color:#BFD9FF}
.cube3d i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s) / 2));background-color:#D9CCFF}
.cube3d i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s) / 2));background-color:#FFB3A8}
.cube3d.sm{--s:40px}
.cube3d.sm i{border-width:2px;border-radius:9px}
@keyframes cubespin{0%{transform:rotateX(-20deg) rotateY(0)}50%{transform:rotateX(-32deg) rotateY(180deg)}100%{transform:rotateX(-20deg) rotateY(360deg)}}
.tilt{transition:transform .18s ease-out}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(35,28,61,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:16px;animation:fadein .15s}
.modal-in{background:#fff;border:var(--line);border-radius:26px;box-shadow:0 8px 0 var(--ink),0 30px 60px rgba(0,0,0,.3);width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;animation:popin .28s cubic-bezier(.2,1.4,.4,1)}
.modal-in.narrow{width:min(460px,100%)}
.modal-in.wide{width:min(1000px,100%)}
.modal-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-hd h2{font-size:26px;flex:1}
.cf-msg{font-family:var(--ui);font-size:17px}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{transform:scale(.85) rotateX(18deg);opacity:0}}

/* ---------- 효과 ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.popword{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:105}
.popword span{font-family:var(--display);font-size:clamp(46px,12vw,92px);color:var(--lemon);-webkit-text-stroke:2.5px var(--ink);
  text-shadow:4px 4px 0 var(--coral),8px 9px 0 var(--ink);animation:popword 1s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes popword{0%{transform:scale(.2) rotate(-12deg);opacity:0}30%{transform:scale(1.1) rotate(3deg);opacity:1}75%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.2);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* =========================== 호스트 보드 =========================== */
.hbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 4px 0 rgba(35,28,61,.08)}
.hosttag{background:var(--ink);color:#fff}
.bigtabs{display:flex;gap:10px;flex-wrap:wrap}
.bigtabs button{position:relative;display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);font-size:18px;border:var(--line);border-radius:16px;background:#F4EFFF;padding:8px 18px;
  box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.bigtabs button:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.bigtabs button.on{background:var(--lemon);transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.bt-e{font-size:22px}
.bt-n{position:absolute;top:-10px;right:-10px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--coral);color:#fff;border:2px solid var(--ink);font-size:14px;display:grid;place-items:center;font-weight:400}
.save-dot{font-family:var(--ui);font-size:13px;color:var(--muted);margin-left:auto}
.hwrap{padding:22px 16px 80px;max-width:1280px;margin:0 auto}
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid-2{grid-template-columns:1fr}}

/* 잠금 */
.lockwrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.lockcard{width:min(420px,100%);text-align:center;padding:30px 24px}
.lockcard .fld{text-align:left}
.loading{font-family:var(--ui);font-size:22px;animation:bob 1.2s ease-in-out infinite}

/* 세팅 레이아웃 */
.setup{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.setup{grid-template-columns:1fr}}
.cls-col{display:grid;gap:16px;position:sticky;top:90px}
@media (max-width:900px){.cls-col{position:static}}
.cls-new h3{font-size:20px;margin-bottom:10px}
.cls-new .row{flex-wrap:nowrap}
.cls-new input{min-width:0}
.cls-list{display:grid;gap:12px;perspective:900px}
@media (max-width:900px){.cls-list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.ctile{--c:#FF6B5A;position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:var(--line);border-radius:18px;padding:12px 14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,#fff),#fff 70%);box-shadow:0 5px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.ctile:hover{transform:translateY(-2px) rotateX(6deg)}
.ctile.on{background:var(--c);color:#fff;box-shadow:0 7px 0 var(--ink),0 14px 24px color-mix(in srgb,var(--c) 45%,transparent);transform:translateX(6px)}
.ctile.on small,.ctile.on em{color:#fff}
.ctile-emo{font-size:28px;width:46px;height:46px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);flex:0 0 auto}
.ctile-t{display:grid;min-width:0}
.ctile-t b{font-family:var(--ui);font-size:18px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile-t small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile-t em{font-style:normal;color:var(--coral-d)}
.ctile-live{position:absolute;top:-9px;right:10px;font-family:var(--ui);font-size:12px;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 7px;animation:blink 1.6s infinite}
@keyframes blink{50%{filter:brightness(1.25)}}
.empty-note{font-family:var(--ui);color:var(--muted);text-align:center;padding:10px}

.cls-main{display:grid;min-width:0}
.cls-head{--c:#FF6B5A;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 30%,#fff),#fff 60%)}
.cls-emo{font-size:34px;width:60px;height:60px;border:var(--line);border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--ink);transition:transform .15s;flex:0 0 auto}
.cls-emo:hover{transform:rotate(-8deg) scale(1.05)}
.title-in{font-family:var(--display);font-size:28px;border-color:transparent;background:transparent;box-shadow:none;padding:4px 8px;min-width:0}
.title-in:hover{border-color:rgba(35,28,61,.25)}

/* 배포 패널 */
.livep{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.livep.on{background:linear-gradient(135deg,#FFF6D6,#fff 55%,#E8F3FF);border-width:3px}
@media (max-width:680px){.livep{grid-template-columns:1fr}.live-qr{justify-self:center}}
.live-l{display:grid;gap:12px;min-width:0}
.livebadge{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);font-size:15px;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.livebadge i{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.livebadge.sm{font-size:13px;padding:0 10px;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.live-work{--c:#FF6B5A;display:flex;gap:14px;align-items:center}
.live-emo{font-size:40px;width:70px;height:70px;display:grid;place-items:center;border:var(--line);border-radius:20px;background:var(--c);box-shadow:0 5px 0 var(--ink);transform:rotate(-6deg);flex:0 0 auto}
.live-work h2{font-size:32px}
.live-work p{margin:2px 0 0;color:var(--muted);font-family:var(--ui)}
.urlbox{display:flex;align-items:center;gap:8px;border:2px dashed var(--ink);border-radius:14px;padding:6px 8px 6px 12px;background:#fff;min-width:0}
.urlbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.urlbox a.btn{text-decoration:none;color:inherit}
.urlbox.big code{font-size:15px}
.warnbox{border:2px solid var(--ink);border-radius:12px;background:#FFE7A6;padding:8px 12px;font-family:var(--ui)}
.live-qr{cursor:zoom-in;width:170px;height:170px;padding:10px;background:#fff;border:var(--line);border-radius:18px;box-shadow:0 6px 0 var(--ink);transform:rotate(2deg);transition:transform .2s}
.live-qr:hover{transform:rotate(0) scale(1.04)}
.live-qr img,.live-qr canvas{width:100%!important;height:100%!important;display:block}
.live-off{display:flex;gap:16px;align-items:center;grid-column:1/-1}
.live-off-emo{font-size:46px;animation:wiggle 2s infinite}
.live-off h3{font-size:22px}
.live-off p{margin:4px 0 0}

/* 작품 서가: 3D 책 */
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 20px;perspective:1100px}
.wcard{--c:#FF6B5A;--d:#D9483A;display:grid;gap:12px}
.wbook{position:relative;border:0;padding:0;background:none;height:250px;transform-style:preserve-3d;transform:rotateY(-18deg) rotateX(4deg);transition:transform .35s cubic-bezier(.2,1.2,.4,1);text-align:left}
.wbook:hover,.wbook:focus-visible{transform:rotateY(-4deg) rotateX(0) translateY(-8px)}
.wspine{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,var(--d),color-mix(in srgb,var(--d) 70%,#000));border:var(--line);border-radius:10px 0 0 10px;transform:translateX(-13px) rotateY(-90deg) translateX(-13px);transform-origin:left}
.wcover{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;padding:16px 14px 14px 20px;border:var(--line);border-radius:6px 16px 16px 6px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,var(--d) 100%);color:#fff;
  box-shadow:8px 10px 0 var(--ink),14px 22px 30px rgba(35,28,61,.25),inset 10px 0 0 rgba(0,0,0,.12),inset 12px 0 0 rgba(255,255,255,.25)}
.wcover::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35) 0 18%,transparent 34%);pointer-events:none}
.wtype{align-self:flex-start;font-family:var(--ui);font-size:12px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 7px}
.wlive{position:absolute;top:12px;right:10px;font-family:var(--ui);font-size:12px;background:var(--ink);color:#fff;border-radius:8px;padding:0 7px;animation:blink 1.4s infinite}
.wemo{font-size:46px;margin:8px 0 2px;filter:drop-shadow(3px 4px 0 rgba(35,28,61,.35))}
.wtitle{font-family:var(--display);font-size:25px;line-height:1.15;text-shadow:2px 2px 0 rgba(35,28,61,.45);word-break:keep-all;overflow-wrap:anywhere}
.wby{font-family:var(--ui);font-size:15px;opacity:.95}

/* ---------- 한국어 조사: 받침 있으면 앞, 없으면 뒤 (예: josa('동백꽃','은','는')) ---------- */
function hasBatchim(s){
  s=String(s||'').replace(/[\s"'”’」』》)\]]+$/,'');
  const ch=s.charCodeAt(s.length-1);
  if(ch>=0xAC00&&ch<=0xD7A3)return (ch-0xAC00)%28!==0;
  if(/[0-9]$/.test(s))return /[013678]$/.test(s);
  return null;
}
function josa(s,a,b){const h=hasBatchim(s);return h===null?a+'('+b+')':(h?a:b)}

/* ---------- 저장소 ---------- */
const Store=(()=>{
  let all={},ver=0,key='',pollMs=3000,timer=null,pulling=false,online=true;
  const listeners=new Set();
  const notify=()=>listeners.forEach(f=>{try{f()}catch(e){console.error(e)}});
  const merge=(a,b)=>{for(const k in b){const x=a[k],y=b[k];if(y&&typeof y==='object'&&!Array.isArray(y)&&x&&typeof x==='object'&&!Array.isArray(x))merge(x,y);else a[k]=y}return a};
  /* ---- 체험 모드: 이 브라우저 localStorage ---- */
  const LKEY='odok-db-v1';
  const lload=()=>LS.get(LKEY,{});
  const lsave=()=>{try{localStorage.setItem(LKEY,JSON.stringify(all));return true}catch(e){return false}};
  if(LOCAL)window.addEventListener('storage',e=>{if(e.key===LKEY){all=lload();notify()}});
  function applyLocal(op){
    if(op.op==='set')all[op.path]=clone(op.data);
    else if(op.op==='update')all[op.path]=merge(all[op.path]||{},clone(op.data));
    else if(op.op==='delete')delete all[op.path];
    return{ok:true};
  }
  /* ---- 온라인: Apps Script ---- */
  async function pull(){
    if(LOCAL||pulling)return;pulling=true;
    try{
      const r=await (await fetch(API_URL+'?op=pull&since='+ver+(key?'&key='+encodeURIComponent(key):''),{cache:'no-store'})).json();
      if(!r.ok)throw new Error(r.error||'pull');
      const ks=Object.keys(r.docs||{});
      ks.forEach(p=>{if(r.docs[p]===null)delete all[p];else all[p]=r.docs[p]});
      ver=Math.max(ver,r.ver||0);
      if(!online){online=true;setNet(true)}
      if(ks.length)notify();
    }catch(e){if(online){online=false;setNet(false)}console.warn(e)}
    finally{pulling=false}
  }
  function setNet(ok){const d=$('#netdot');if(d)d.hidden=ok;if(!ok)toast('서버와 연결이 불안정해요. 잠시 후 자동으로 다시 이어져요.')}
  function loop(){clearTimeout(timer);timer=setTimeout(async()=>{await pull();loop()},document.hidden?Math.max(pollMs*4,12000):pollMs)}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!LOCAL){pull();loop()}});
  async function post(body){
    if(LOCAL){
      const res=body.op==='batch'?{ok:true,results:body.ops.map(applyLocal)}:applyLocal(body);
      if(!lsave()){const err=new Error('too_big');err.code='local_full';throw err}
      notify();return res;
    }
    const optimistic=o=>{if(o.op==='set')all[o.path]=clone(o.data);else if(o.op==='update')all[o.path]=merge(all[o.path]||{},clone(o.data));else if(o.op==='delete')delete all[o.path]};
    (body.op==='batch'?body.ops:[body]).forEach(optimistic);notify();
    let r;
    for(let i=0;i<3;i++){
      try{r=await (await fetch(API_URL,{method:'POST',body:JSON.stringify({...body,key})})).json();if(r.ok||r.error!=='busy')break}
      catch(e){r={ok:false,error:'network'}}
      await sleep(600+i*800);
    }
    if(!r||!r.ok){const err=new Error((r&&r.error)||'network');err.code=(r&&r.error)||'network';pull();throw err}
    pull();return r;
  }
  return{
    async init({poll=3000,hostKey=''}={}){pollMs=poll;key=hostKey;if(LOCAL){all=lload();return}await pull();loop()},
    on(fn){listeners.add(fn);return()=>listeners.delete(fn)},
    doc(p){return clone(all[p])},
    peek(p){return all[p]},
    coll(prefix){const out={};const pre=prefix+'/';for(const p in all){if(p.startsWith(pre)&&p.indexOf('/',pre.length)<0)out[p.slice(pre.length)]=all[p]}return out},
    refresh:pull,
    set:(path,data)=>post({op:'set',path,data}),
    update:(path,data)=>post({op:'update',path,data}),
    del:path=>post({op:'delete',path}),
    batch:ops=>post({op:'batch',ops}),
    /* 게스트: 내 기록 불러오기 (이름이 맞을 때만) */
    async mine(path,name){
      if(LOCAL){const d=all[path];if(!d)return{data:null};return d.name===name?{data:clone(d)}:{taken:true}}
      const r=await (await fetch(API_URL+'?op=mine&path='+encodeURIComponent(path)+'&name='+encodeURIComponent(name),{cache:'no-store'})).json();
      if(!r.ok)throw Object.assign(new Error(r.error),{code:r.error});
      return r;
    },
    /* 게스트: 표현 콕콕 파일 올리기 */
    async upload({classId,round,name,mime,dataUrl}){
      if(LOCAL)return{ok:true,url:dataUrl,local:true};
      const data=dataUrl.slice(dataUrl.indexOf(',')+1);
      const r=await (await fetch(API_URL,{method:'POST',body:JSON.stringify({op:'upload',classId,round,name,mime,data})})).json();
      if(!r.ok)throw Object.assign(new Error(r.error),{code:r.error});
      return r;
    }
  };
})();

  if(LOCAL)return true;
  try{const r=await (await fetch(API_URL+'?op=auth&key='+encodeURIComponent(k),{cache:'no-store'})).json();return !!r.ok}catch(e){return null}

function dbErr(e){
  const c=e&&e.code;
  if(c==='host_only')toast('호스트 비밀번호가 필요해요. 새로고침 후 다시 입력해 주세요.');

  else if(c==='local_full')toast('체험 모드 저장 공간이 가득 찼어요. (파일이 너무 커요)');
  else toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.');
  console.warn(e);
}

function syncS(){S.classes=Store.coll('classes');S.works=Store.coll('works');S.subs=Store.coll('subs');S.app=Store.peek('settings/app')||{}}
function classesSorted(){return Object.entries(S.classes).map(([id,c])=>({...c,id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
/* 이름(학번) 한 칸: 띄어쓰기·괄호 모양을 맞춰서 같은 사람은 늘 같은 기록으로 */
function normName(v){return String(v||'').trim().replace(/\s+/g,' ').replace(/\s*[(（]\s*/g,'(').replace(/\s*[)）]/g,')')}
function idKey(s){let h1=0x811c9dc5,h2=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0}return h1.toString(36)+h2.toString(36)}
function subKey(cid,round,name){return 'subs/'+cid+'-'+round+'-'+idKey(normName(name))}

/* ---------- 공통 조각 ---------- */
function charOf(i){return CHARS[i]||CHARS[0]}
function avatar(i,cls=''){const c=charOf(i);return `<span class="av ${cls}" style="--c:${c[2]}" title="${esc(c[1])}"><span>${c[0]}</span></span>`}
function workTitle(w){return w?'「'+(w.title||'제목 없음')+'」':'「작품」'}
function stepDone(sub,k){return !!(sub&&sub.steps&&sub.steps[k]&&sub.steps[k].done)}
function stepTouched(sub,k){
  const s=sub&&sub.steps&&sub.steps[k];if(!s)return false;if(s.done)return true;
  if(k==='prologue')return !!(s.a||s.b);
  if(k==='review')return !!(s.stars||s.line);
  if(k==='create')return !!(s.file||s.kind);
  return (s.items||[]).some(it=>Object.values(it).some(v=>String(v||'').trim()));
}
function doneCount(sub){return STEPS.filter(s=>stepDone(sub,s.k)).length}
function starsHTML(n,cls=''){return `<span class="stars-s ${cls}" aria-label="별 ${n}개">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`}
function ago(t){if(!t)return '';const s=Math.round((Date.now()-t)/1000);if(s<60)return '방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';return new Date(t).toLocaleDateString('ko-KR')}
function fmtDate(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+'MB':Math.max(1,Math.round(b/1024))+'KB'}

/* 마우스를 올리면 .tilt 요소가 입체적으로 기울어짐 */
let tiltEl=null;
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const el=e.target.closest&&e.target.closest('.tilt');
  if(tiltEl&&tiltEl!==el)tiltEl.style.transform='';
  tiltEl=el;if(!el)return;
  const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  el.style.transform=`perspective(800px) rotateX(${(-y*10).toFixed(2)}deg) rotateY(${(x*12).toFixed(2)}deg) translateY(-4px)`;
});
document.addEventListener('pointerleave',()=>{if(tiltEl){tiltEl.style.transform='';tiltEl=null}});

/* 배포: 새 회차를 만들어 게스트에게 열기 */
async function deploy(cid,wid,{round=null}={}){
  const c=hCls(cid);if(!c)return;
  const hist=histOf(c).slice();
  let r=round;
  if(!r){r=uid('r');hist.push({round:r,workId:wid,at:Date.now()})}
  const at=round?(hist.find(h=>h.round===round)||{}).at||Date.now():Date.now();
  await hWrite(()=>Store.update('classes/'+cid,{deploy:{workId:wid,round:r,at},history:hist}));
  showQR(cid,true);
}

const BVIEW={
  people(subs){
    return `<div class="people">${subs.map(s=>{const st=s.steps||{};const rv=st.review;return `
      <button class="pcard tilt" data-act="sub" data-k="${esc(s._k)}">
        ${avatar(s.char,'lg')}
        <span class="pc-t"><span>${esc(s.name)}</span></span>
        ${pips(s)}
        <span class="pc-f">${rv&&rv.done?starsHTML(+rv.stars||0):'<span class="muted">별점 전</span>'}${st.create&&st.create.file?' <span title="표현물">🎨</span>':''}${doneCount(s)===STEPS.length?' <span title="완주">🏁</span>':''}</span>
        <small class="muted">${ago(s.updatedAt)}</small>
      </button>`}).join('')}</div>`;
  },
  prologue(subs,w){
    const L=subs.filter(s=>stepDone(s,'prologue'));if(!L.length)return nothing();
    return `<div class="plist">${L.map(s=>{const p=s.steps.prologue;return `<div class="card pro">${who(s)}<p class="pro-t"><mark>${esc(workTitle(w))}</mark>${josa(workTitle(w),'은','는')} <u>${esc(p.a)}</u> 내용이다. <u>${esc(p.b)}</u>${josa(p.b,'을','를')} 말하려는 것 같다.</p></div>`}).join('')}</div>`;
  },
  words(subs){
    const map={};
    subs.filter(s=>stepDone(s,'words')).forEach(s=>(s.steps.words.items||[]).forEach(it=>{const k=String(it.w||'').trim();if(!k)return;(map[k]=map[k]||[]).push({s,m:it.m})}));
    const ks=Object.keys(map).sort((a,b)=>map[b].length-map[a].length||a.localeCompare(b,'ko'));
    if(!ks.length)return nothing();
    return `<div class="wcloud">${ks.map(k=>`<span class="wc" style="--s:${Math.min(1.9,1+map[k].length*.18)}">${esc(k)}${map[k].length>1?`<b>${map[k].length}</b>`:''}</span>`).join('')}</div>
      <div class="wlist">${ks.map(k=>`<div class="card witem"><h3>🔍 ${esc(k)} ${map[k].length>1?`<span class="tag">${map[k].length}명</span>`:''}</h3>${map[k].map(x=>`<div class="wm">${avatar(x.s.char,'sm')}<span><b>${esc(x.s.name)}</b> ${esc(x.m)}</span></div>`).join('')}</div>`).join('')}</div>`;
  },
  sentences(subs){
    const L=[];subs.filter(s=>stepDone(s,'sentences')).forEach(s=>(s.steps.sentences.items||[]).forEach(it=>{if(String(it.s||'').trim())L.push({s,...it})}));
    if(!L.length)return nothing();
    return `<div class="quotes">${L.map(x=>`<div class="card quote"><p class="q-s">${esc(x.s)}</p><p class="q-r">💭 ${esc(x.r)}</p>${who(x.s)}</div>`).join('')}</div>`;
  },
  questions(subs){
    const by={};QCATS.forEach(q=>by[q.k]=[]);
    subs.filter(s=>stepDone(s,'questions')).forEach(s=>(s.steps.questions.items||[]).forEach(it=>{if(String(it.q||'').trim()&&by[it.cat])by[it.cat].push({s,...it})}));
    if(!Object.values(by).some(l=>l.length))return nothing();
    return `<div class="kanban">${QCATS.map(q=>`<div class="kcol" style="--c:${q.c}"><h3>${q.e} ${q.n}<small>${q.s}</small> <span>${by[q.k].length}</span></h3>
      ${by[q.k].map(x=>`<div class="kcard"><p>${esc(x.q)}</p>${who(x.s)}</div>`).join('')||'<p class="muted" style="text-align:center">—</p>'}</div>`).join('')}</div>`;
  },
  review(subs){
    const L=subs.filter(s=>stepDone(s,'review'));if(!L.length)return nothing();
    const cnt=[0,0,0,0,0,0];L.forEach(s=>cnt[+s.steps.review.stars||0]++);const mx=Math.max(...cnt,1);
    return `<div class="rv-wrap"><div class="card rv-dist">${[5,4,3,2,1].map(i=>`<div class="rv-row">${starsHTML(i)}<span class="rv-bar"><i style="width:${cnt[i]/mx*100}%"></i></span><b>${cnt[i]}</b></div>`).join('')}</div>
      <div class="rv-list">${L.sort((a,b)=>(b.steps.review.stars||0)-(a.steps.review.stars||0)).map(s=>`<div class="card rv">${starsHTML(+s.steps.review.stars||0)}<p>“${esc(s.steps.review.line)}”</p>${who(s)}</div>`).join('')}</div></div>`;
  },
  create(subs){
    const L=subs.filter(s=>s.steps&&s.steps.create&&s.steps.create.file);if(!L.length)return nothing();
    return `<div class="gallery">${L.map(s=>{const f=s.steps.create.file;const img=/^image\//.test(f.mime||'');const th=img?(f.url.startsWith('data:')?f.url:(f.id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(f.id)}&sz=w400`:'')):'';return `
      <div class="card gcard">${th?`<a href="${esc(f.url)}" target="_blank" rel="noopener" class="gthumb"><img src="${esc(th)}" alt="${esc(f.name)}" loading="lazy" referrerpolicy="no-referrer"></a>`:`<div class="gthumb emo">${KIND_EMO[f.kind]||'📎'}</div>`}
        <span class="tag" style="background:#C9F3E6">${KIND_EMO[f.kind]||''} ${esc(f.kind||'')}</span>${fileLink(f)}${who(s)}</div>`}).join('')}</div>`;
  }
};
function subDetail(k){
  const s=S.subs[k.replace(/^subs\//,'')];if(!s)return;const st=s.steps||{};const w=S.works[s.workId];
  const blk=(step,body)=>`<section class="dsec" style="--c:${step.c}"><h3><span>${step.e}</span>${step.no} · ${step.t} ${stepDone(s,step.k)?'<span class="tag" style="background:#C9F3E6">제출 ✓</span>':stepTouched(s,step.k)?'<span class="tag" style="background:#FFF1C2">작성 중</span>':'<span class="tag" style="background:#EEE">아직</span>'}</h3>${body}</section>`;
  const p=st.prologue||{};const items=(x)=>(st[x]&&st[x].items)||[];
  modal(`<div class="modal-hd">${avatar(s.char,'lg')}<h2>${esc(s.name)}</h2><button class="btn sm" data-close>닫기</button></div>
    <p class="muted" style="margin-top:-6px">${esc(workTitle(w))} · 마지막 저장 ${ago(s.updatedAt)} · ${doneCount(s)}/${STEPS.length}단계 완료</p>
    <div class="dstack">
    ${blk(STEPS[0],p.a||p.b?`<p class="pro-t"><mark>${esc(workTitle(w))}</mark>${josa(workTitle(w),'은','는')} <u>${esc(p.a||'…')}</u> 내용이다. <u>${esc(p.b||'…')}</u>${josa(p.b,'을','를')} 말하려는 것 같다.</p>`:'')}
    ${blk(STEPS[1],items('words').map(it=>`<div class="dline"><b>${esc(it.w)}</b> ${esc(it.m)}</div>`).join(''))}
    ${blk(STEPS[2],items('sentences').map(it=>`<div class="dline"><b>“${esc(it.s)}”</b><br><span class="muted">💭 ${esc(it.r)}</span></div>`).join(''))}
    ${blk(STEPS[3],items('questions').map(it=>{const q=QCAT[it.cat];return `<div class="dline">${q?`<span class="tag" style="background:${q.c};color:#fff">${q.e} ${qcatLabel(q)}</span> `:''}${esc(it.q)}</div>`}).join(''))}
    ${blk(STEPS[4],st.review&&(st.review.stars||st.review.line)?`<div class="dline">${starsHTML(+st.review.stars||0)} ${esc(st.review.line||'')}</div>`:'')}
    ${blk(STEPS[5],st.create&&st.create.file?fileLink(st.create.file):'')}
    </div>`,{wide:true});
}
function csv(){
  const c=hCls(H.bcid);const h=histOf(c).find(x=>x.round===H.bround);if(!h)return;const w=S.works[h.workId];
  const subs=subsOf(c.id,h.round);
  const rows=[['이름(학번)','캐릭터','완료 단계','프롤로그(내용)','프롤로그(주제)','단어 콕콕','문장 콕콕','질문 콕콕','별점','한 줄 평','표현 종류','표현 파일','파일 주소','마지막 저장']];
  subs.forEach(s=>{const st=s.steps||{};const it=k=>(st[k]&&st[k].items)||[];const f=st.create&&st.create.file;
    rows.push([s.name,charOf(s.char)[1],doneCount(s)+'/'+STEPS.length,(st.prologue||{}).a||'',(st.prologue||{}).b||'',
      it('words').map(x=>`${x.w}: ${x.m}`).join(' / '),it('sentences').map(x=>`"${x.s}" (${x.r})`).join(' / '),
      it('questions').map(x=>`[${qcatLabel(QCAT[x.cat])}] ${x.q}`).join(' / '),(st.review||{}).stars||'',(st.review||{}).line||'',
      (st.create||{}).kind||'',f?f.name:'',f&&!String(f.url).startsWith('data:')?f.url:'',s.updatedAt?new Date(s.updatedAt).toLocaleString('ko-KR'):''])});
  const text='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  a.download=`오독오독_${c.name}_${(w&&w.title)||'작품'}_${new Date(h.at).toLocaleDateString('ko-KR').replace(/\.\s?/g,'-').replace(/-$/,'')}.csv`.replace(/[\\/:*?"<>|]/g,' ');
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- 동작 ---------- */
const ACT={
  view(b){H.view=b.dataset.v;LS.set('odok-h-view',H.view);closeModal();hRender();window.scrollTo(0,0)},
  lock(){confirmBox('이 컴퓨터에 기억된 호스트 비밀번호를 지우고 잠글까요?','잠그기',()=>{LS.set('odok-h-key','');location.reload()})},
  'add-class'(){
    const inp=$('#new-cls');const name=(inp.value||'').trim();if(!name){toast('클래스 이름을 써 주세요.');inp.focus();return}
    const n=classesSorted().length;const id=uid('c');
    inp.value='';inp.blur();H.cid=id;LS.set('odok-h-cid',id);
    hWrite(()=>Store.set('classes/'+id,{name,color:CLS_COLORS[n%CLS_COLORS.length],emo:CLS_EMO[n%CLS_EMO.length],createdAt:Date.now(),history:[]})).then(()=>{pop('뚝딱!');toast(`「${name}」 클래스를 만들었어요. 이제 작품을 등록해요!`)});
  },
  'pick-class'(b){H.cid=b.dataset.id;LS.set('odok-h-cid',H.cid);hRender()},
  'class-emo'(){const c=hCls();const i=(CLS_EMO.indexOf(c.emo)+1)%CLS_EMO.length;hWrite(()=>Store.update('classes/'+c.id,{emo:CLS_EMO[i]}))},
  'del-class'(b){const c=hCls(b.dataset.id);confirmBox(`「${esc(c.name)}」 클래스를 삭제할까요?<br><span class="muted" style="font-size:14px">등록한 작품은 서가에 남아 다른 클래스에서 가져올 수 있어요.</span>`,'삭제',()=>hWrite(()=>Store.del('classes/'+c.id)),{danger:true})},
  'add-work'(){if(!hCls()){toast('먼저 클래스를 만들어 주세요.');return}workForm(null)},
  'edit-work'(b){workForm(b.dataset.id)},
  'link-work'(b){const c=hCls();const w=S.works[b.dataset.id];closeModal();hWrite(()=>Store.update('works/'+b.dataset.id,{classIds:[...new Set([...(w.classIds||[]),c.id])]})).then(()=>toast(`${workTitle(w)}을(를) 가져왔어요.`))},
  'unlink-work'(b){const c=hCls();const w=S.works[b.dataset.id];closeModal();hWrite(()=>Store.update('works/'+b.dataset.id,{classIds:(w.classIds||[]).filter(x=>x!==c.id)}))},
  'del-work'(b){const w=S.works[b.dataset.id];confirmBox(`${esc(workTitle(w))}을(를) 모든 클래스에서 완전히 삭제할까요?`,'삭제',()=>hWrite(()=>Store.del('works/'+b.dataset.id)),{danger:true})},
  deploy(b){deployAsk(b.dataset.id)},
  qr(b){showQR(b.dataset.id)},
  copy(b){copyText(b.dataset.t)},
  stop(b){const c=hCls(b.dataset.id);confirmBox('배포를 멈출까요?<br><span class="muted" style="font-size:14px">게스트가 새로 들어올 수 없어요. 제출한 내용은 그대로 남아요.</span>','멈추기',()=>hWrite(()=>Store.update('classes/'+c.id,{deploy:null})))},
  reopen(b){const c=hCls(b.dataset.id);const h=histOf(c).find(x=>x.round===b.dataset.r);if(h)deploy(c.id,h.workId,{round:h.round})},
  'to-board'(b){closeModal();H.view='board';LS.set('odok-h-view','board');H.bcid=b.dataset.id;H.bround=b.dataset.r;hRender();window.scrollTo(0,0)},
  'go-setup'(b){H.view='setup';H.cid=b.dataset.id;LS.set('odok-h-view','setup');hRender()},
  bcls(b){H.bcid=b.dataset.id;H.bround=null;hRender()},
  btab(b){H.btab=b.dataset.k;hRender()},
  sub(b){subDetail(b.dataset.k)},
  csv(){csv()},
  'save-url'(){const v=$('#guest-url').value.trim();hWrite(()=>Store.update('settings/app',{guestUrl:v})).then(()=>toast('게스트용 주소를 저장했어요.'))}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='DETAILS')return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='new-cls'){e.preventDefault();ACT['add-class']()}});
document.addEventListener('change',e=>{
  const el=e.target;const k=el.dataset&&el.dataset.ch;if(!k)return;
  if(k==='class-name'){const v=el.value.trim();if(!v){el.value=(S.classes[el.dataset.id]||{}).name||'';return}hWrite(()=>Store.update('classes/'+el.dataset.id,{name:v}))}
  if(k==='bround'){H.bround=el.value;hRender()}
});

/* ---------- 시작 ---------- */
function lockScreen(msg=''){
  app.innerHTML=`<div class="lockwrap"><div class="card lockcard">
    <div class="welcome-emo">${cube3d()}</div><div class="logo"><span>오</span><span>독</span><span>오</span><span>독</span></div>
    <p class="tagline">호스트 보드</p>
    <form id="kform" class="stack" style="margin-top:14px"><label class="fld">호스트 비밀번호<input class="in" id="hkey" type="password" autocomplete="current-password" required></label>
    ${msg?`<p style="color:var(--coral-d);margin:0;font-family:var(--ui)">${msg}</p>`:''}
    <button class="btn coral big">들어가기 ▶</button></form></div></div>`;
  $('#hkey').focus();
  $('#kform').onsubmit=async e=>{e.preventDefault();const k=$('#hkey').value;const ok=await checkHostKey(k);
    if(ok===null)return lockScreen('서버에 연결하지 못했어요. 인터넷을 확인해 주세요.');
    if(!ok)return lockScreen('비밀번호가 맞지 않아요.');
    LS.set('odok-h-key',k);startHost(k)};
}
async function startHost(key){
  app.innerHTML='<div class="lockwrap"><div class="loading">🐿️ 오독오독 불러오는 중…</div></div>';
  await Store.init({poll:3000,hostKey:key});
  syncS();hRender();
  Store.on(()=>{syncS();hRender()});
}
(async function boot(){
  if(LOCAL)return startHost('');
  const k=LS.get('odok-h-key','');
  if(k){const ok=await checkHostKey(k);if(ok!==false)return startHost(k)}
  lockScreen();
})();

</script>
