<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오독오독</title>
<meta name="description" content="문학·비문학·영화를 읽고 보며 감상을 나누는 게스트 화면">
<meta name="theme-color" content="#FFD84D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오독오독">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap">

<style>
:root{
  color-scheme: light;
  --bg:#FFF3E4; --bg2:#FFE6CC; --card:#FFFFFF; --ink:#231C3D; --muted:#6D6689;
  --coral:#FF6B5A; --coral-d:#D9483A; --lemon:#FFD84D; --lemon-d:#E0AE00; --mint:#23BF98; --mint-d:#11917A;
  --sky:#4DA3FF; --sky-d:#2474D1; --lilac:#8E6CFF; --lilac-d:#6446D6; --pink:#FF6FA3; --pink-d:#D9437A; --orange:#FFA64D;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --line:2.5px solid var(--ink);
  --pop:0 6px 0 var(--ink),0 14px 26px rgba(35,28,61,.16);
  --pop-sm:0 4px 0 var(--ink),0 8px 14px rgba(35,28,61,.14);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 8% -8%,rgba(255,111,163,.20),transparent 60%),
    radial-gradient(800px 560px at 105% 10%,rgba(77,163,255,.20),transparent 60%),
    radial-gradient(900px 600px at 50% 115%,rgba(35,191,152,.18),transparent 60%),
    radial-gradient(rgba(35,28,61,.08) 1.2px,transparent 1.4px) 0 0/14px 14px,
    var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:grid;gap:12px}
[hidden]{display:none!important}

/* ---------- 3D 기본 조각 ---------- */
.card{background:var(--card);border:var(--line);border-radius:22px;box-shadow:var(--pop);padding:18px}
.btn{position:relative;font-family:var(--ui);font-size:16px;border:var(--line);border-radius:14px;background:var(--card);padding:9px 16px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;
  background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.coral{background-color:var(--coral);color:#fff}
.btn.lemon{background-color:var(--lemon)}
.btn.mint{background-color:var(--mint);color:#fff}
.btn.sky{background-color:var(--sky);color:#fff}
.btn.lilac{background-color:var(--lilac);color:#fff}
.btn.pink{background-color:var(--pink);color:#fff}
.btn.ink{background-color:var(--ink);color:#fff}
.btn.big{font-size:20px;padding:13px 22px;border-radius:18px}
.btn.sm{font-size:14px;padding:5px 11px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn.sm:active{transform:translateY(3px)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.45;pointer-events:none}
.fld{display:grid;gap:5px;font-family:var(--ui);font-size:14px}
input.in,select.in,textarea.in{width:100%;border:var(--line);border-radius:14px;padding:10px 13px;background:#fff;font-family:var(--body);font-size:16px;
  box-shadow:inset 0 3px 0 rgba(35,28,61,.08);transition:box-shadow .15s,background .15s}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;background:#FFFDF5;box-shadow:inset 0 3px 0 rgba(35,28,61,.08),0 0 0 4px rgba(77,163,255,.35)}
textarea.in{resize:vertical;line-height:1.6}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--ui);font-size:13px;border:2px solid var(--ink);border-radius:9px;padding:0 8px;background:var(--lemon);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160%);background:var(--ink);color:#fff;
  font-family:var(--ui);padding:11px 20px;border-radius:16px;z-index:120;transition:transform .25s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- 3D 로고 ---------- */
.logo{display:inline-flex;gap:.02em;font-family:var(--display);font-size:clamp(52px,14vw,104px);line-height:1;letter-spacing:.02em}
.logo span{display:inline-block;color:var(--lemon);-webkit-text-stroke:2.5px var(--ink);
  text-shadow:1px 1px 0 var(--coral),2px 2px 0 var(--coral),3px 3px 0 var(--coral),4px 4px 0 var(--coral),5px 5px 0 var(--coral-d),6px 6px 0 var(--coral-d),7px 7px 0 var(--coral-d),8px 8px 0 var(--ink),9px 10px 0 var(--ink),10px 16px 18px rgba(35,28,61,.25);
  animation:crunch 2.6s ease-in-out infinite}
.logo span:nth-child(2){color:#9FE9D4;animation-delay:.15s}
.logo span:nth-child(3){color:#FFC2DA;animation-delay:.3s}
.logo span:nth-child(4){color:#BFD9FF;animation-delay:.45s}
@keyframes crunch{0%,70%,100%{transform:translateY(0) rotate(0)}78%{transform:translateY(-8px) rotate(-4deg)}86%{transform:translateY(0) rotate(3deg) scale(1.04,.94)}}
.logo.sm{font-size:30px}
.logo.sm span{-webkit-text-stroke:1.5px var(--ink);text-shadow:1px 1px 0 var(--coral),2px 2px 0 var(--coral-d),3px 3px 0 var(--ink),4px 4px 0 var(--ink);animation:none}
.tagline{font-family:var(--ui);font-size:17px;margin:0}

/* ---------- 캐릭터 (광택 구슬) ---------- */
.av{--c:#FFD84D;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:0 0 auto;border:2.5px solid var(--ink);
  background:radial-gradient(circle at 32% 28%,#fff 0 8%,color-mix(in srgb,var(--c) 55%,#fff) 22%,var(--c) 58%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:0 4px 0 var(--ink),inset -4px -6px 10px rgba(0,0,0,.12)}
.av span{font-size:24px;line-height:1;filter:drop-shadow(0 2px 0 rgba(35,28,61,.25))}
.av.sm{width:34px;height:34px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.av.sm span{font-size:18px}
.av.lg{width:64px;height:64px}
.av.lg span{font-size:36px}
.av.xl{width:120px;height:120px;border-width:3px;box-shadow:0 8px 0 var(--ink),0 18px 30px rgba(35,28,61,.25),inset -8px -12px 20px rgba(0,0,0,.14)}
.av.xl span{font-size:68px}

/* ---------- 별 ---------- */
.stars-s{display:inline-flex;gap:1px;font-size:17px;letter-spacing:0}
.stars-s i{font-style:normal;color:#E3DDF0;-webkit-text-stroke:1px rgba(35,28,61,.35)}
.stars-s i.on{color:#FFC62E;-webkit-text-stroke:1px var(--ink)}

/* ---------- 입체 큐브 ---------- */
.cube3d{--s:76px;display:inline-block;width:var(--s);height:var(--s);perspective:600px;flex:0 0 auto}
.cube3d .cb{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;animation:cubespin 10s linear infinite}
.cube3d i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:calc(var(--s) * .46);color:var(--ink);
  border:2.5px solid var(--ink);border-radius:14px;background-image:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);box-shadow:inset -4px -6px 0 rgba(0,0,0,.1)}
.cube3d i:nth-child(1){transform:translateZ(calc(var(--s) / 2));background-color:#FFD84D}
.cube3d i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s) / 2));background-color:#9FE9D4}
.cube3d i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s) / 2));background-color:#FFC2DA}
.cube3d i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s) / 2));background-color:#BFD9FF}
.cube3d i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s) / 2));background-color:#D9CCFF}
.cube3d i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s) / 2));background-color:#FFB3A8}
.cube3d.sm{--s:40px}
.cube3d.sm i{border-width:2px;border-radius:9px}
@keyframes cubespin{0%{transform:rotateX(-20deg) rotateY(0)}50%{transform:rotateX(-32deg) rotateY(180deg)}100%{transform:rotateX(-20deg) rotateY(360deg)}}
.tilt{transition:transform .18s ease-out}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(35,28,61,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:16px;animation:fadein .15s}
.modal-in{background:#fff;border:var(--line);border-radius:26px;box-shadow:0 8px 0 var(--ink),0 30px 60px rgba(0,0,0,.3);width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;animation:popin .28s cubic-bezier(.2,1.4,.4,1)}
.modal-in.narrow{width:min(460px,100%)}
.modal-in.wide{width:min(1000px,100%)}
.modal-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-hd h2{font-size:26px;flex:1}
.cf-msg{font-family:var(--ui);font-size:17px}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{transform:scale(.85) rotateX(18deg);opacity:0}}

/* ---------- 효과 ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.popword{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:105}
.popword span{font-family:var(--display);font-size:clamp(46px,12vw,92px);color:var(--lemon);-webkit-text-stroke:2.5px var(--ink);
  text-shadow:4px 4px 0 var(--coral),8px 9px 0 var(--ink);animation:popword 1s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes popword{0%{transform:scale(.2) rotate(-12deg);opacity:0}30%{transform:scale(1.1) rotate(3deg);opacity:1}75%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.2);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* =========================== 게스트 =========================== */
.gwrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
.grid-2{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* 떠다니는 3D 도형 */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco i{position:absolute;display:block;border:2.5px solid var(--ink);animation:floaty 9s ease-in-out infinite}
.deco .d1{width:70px;height:70px;border-radius:50%;left:6%;top:14%;background:radial-gradient(circle at 30% 28%,#fff 0 8%,#FFD84D 30%,#E0AE00 100%);box-shadow:0 8px 0 var(--ink)}
.deco .d2{width:56px;height:56px;border-radius:14px;right:8%;top:22%;background:linear-gradient(135deg,#FF9AB8,#FF6FA3);box-shadow:6px 6px 0 var(--ink);transform:rotate(18deg);animation-delay:-2s}
.deco .d3{width:0;height:0;border:0;left:10%;bottom:18%;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:58px solid #4DA3FF;filter:drop-shadow(4px 5px 0 var(--ink));animation-delay:-4s}
.deco .d4{width:44px;height:44px;border-radius:50%;right:12%;bottom:24%;background:radial-gradient(circle at 30% 28%,#fff 0 8%,#8EE0C8 30%,#23BF98 100%);box-shadow:0 6px 0 var(--ink);animation-delay:-6s}
.deco .d5{width:90px;height:26px;border-radius:13px;left:44%;top:6%;background:linear-gradient(90deg,#B9A6FF,#8E6CFF);box-shadow:0 6px 0 var(--ink);transform:rotate(-12deg);animation-delay:-3s}
.deco .d6{width:36px;height:36px;border-radius:10px;left:78%;top:62%;background:#FFA64D;box-shadow:5px 5px 0 var(--ink);transform:rotate(-20deg);animation-delay:-5s}
@keyframes floaty{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -22px;rotate:10deg}}
@media (max-width:640px){.deco .d2,.deco .d5{display:none}.deco i{opacity:.7}}

/* 첫 화면 */
.hero{display:grid;justify-items:center;text-align:center;gap:6px;padding-top:14px}
.mascot{position:relative;font-size:64px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(5px 7px 0 rgba(35,28,61,.25))}
.mascot i{position:absolute;right:-48px;top:-6px;font-style:normal;font-family:var(--ui);font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:12px 12px 12px 2px;padding:1px 8px;animation:wiggle 1.6s infinite}
.join-card{display:grid;gap:16px;padding:20px}
.waitcard{display:grid;justify-items:center;gap:6px;text-align:center;padding:30px 20px;font-family:var(--ui);font-size:19px}
.waitcard p{margin:0;font-size:15px}
.wait-emo{font-size:50px;animation:bob 2s ease-in-out infinite}
.today{--c:#FF6B5A;--d:#D9483A;display:flex;gap:16px;align-items:center;border:var(--line);border-radius:20px;padding:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,#fff),#fff 70%);box-shadow:inset 0 -4px 0 rgba(35,28,61,.08)}
.today-book{flex:0 0 auto;width:78px;height:100px;border:var(--line);border-radius:6px 14px 14px 6px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 50%,var(--d));
  box-shadow:6px 7px 0 var(--ink),inset 8px 0 0 rgba(0,0,0,.14);display:grid;place-items:center;transform:perspective(500px) rotateY(-22deg);animation:bookswing 4s ease-in-out infinite}
@keyframes bookswing{50%{transform:perspective(500px) rotateY(-6deg) translateY(-4px)}}
.tb-e{font-size:38px;filter:drop-shadow(2px 3px 0 rgba(35,28,61,.35))}
.today-t{min-width:0}
.today-l{font-family:var(--ui);font-size:13px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px}
.today h2{font-size:30px;margin-top:6px;overflow-wrap:anywhere}
.today p{margin:2px 0 0;font-family:var(--ui);color:var(--muted)}
.today .today-note{color:var(--ink);background:#FFF6D6;border:1.5px dashed var(--ink);border-radius:10px;padding:2px 8px;margin-top:6px;display:inline-block}
.char-hd{display:flex;align-items:center;justify-content:space-between;font-family:var(--ui);font-size:14px;margin-bottom:-6px}
.char-stage{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;border-radius:22px;
  background:radial-gradient(ellipse 60% 18% at 38% 88%,rgba(35,28,61,.18),transparent 70%),linear-gradient(180deg,#F4EEFF,#FFF7EC);border:2px dashed rgba(35,28,61,.3)}
.char-stage .av{animation:bob 2.4s ease-in-out infinite}
.char-stage .av.spin{animation:spinin .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes spinin{from{transform:rotateY(360deg) scale(.5)}}
.char-name{display:grid}
.char-name b{font-family:var(--display);font-weight:400;font-size:28px}
.char-name small{font-family:var(--ui);color:var(--muted)}
.chars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:520px){.chars{grid-template-columns:repeat(5,1fr)}}
.charb{border:0;background:none;padding:4px;border-radius:16px;display:grid;place-items:center;transition:transform .15s}
.charb:hover{transform:translateY(-4px) scale(1.08)}
.charb.on{background:var(--lemon);box-shadow:inset 0 0 0 2.5px var(--ink)}
.charb.on .av{transform:scale(1.08)}
.joinbtn{width:100%;font-size:22px}

/* 상단 HUD */
.ghud{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border:var(--line);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.gh-t{display:grid;min-width:0;flex:1;line-height:1.25}
.gh-t b{font-family:var(--ui);font-weight:400;font-size:17px}
.gh-t small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsave{font-family:var(--ui);font-size:12px;color:var(--muted);white-space:nowrap}
.ring{--p:0;width:48px;height:48px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;flex:0 0 auto;
  background:conic-gradient(var(--mint) calc(var(--p)*1%),#EFEAF7 0)}
.ring span{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--ui);font-size:15px;line-height:1}
.ring small{font-size:10px;color:var(--muted)}
.gbanner{border:var(--line);border-radius:16px;background:#FFF1C2;padding:10px 14px;font-family:var(--ui);display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 4px 0 var(--ink)}
.gbanner.off{background:#EDE8F7}

/* 단계 지도: 3D 큐브 */
.stepper{position:relative;display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:16px 8px 12px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stile{--c:#4DA3FF;--d:#2474D1;flex:1 0 76px;display:grid;justify-items:center;gap:3px;border:0;background:none;padding:0;text-align:center}
.st-cube{position:relative;width:56px;height:56px;border:2.5px solid var(--ink);border-radius:16px;display:grid;place-items:center;background:#fff;
  box-shadow:0 6px 0 #C9C2DA,0 6px 0 2.5px var(--ink);transition:transform .2s,box-shadow .2s,background .2s}
.st-e{font-size:26px;line-height:1}
.st-no{font-family:var(--ui);font-size:11px;color:var(--muted);letter-spacing:.03em}
.st-t{font-family:var(--ui);font-size:13px;white-space:nowrap}
.stile:hover .st-cube{transform:translateY(-3px)}
.stile.done .st-cube{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:0 6px 0 var(--d),0 6px 0 2.5px var(--ink)}
.stile.done .st-e{color:#fff;font-size:24px;text-shadow:0 2px 0 var(--ink)}
.stile.cur .st-cube{background:linear-gradient(160deg,#fff 0%,color-mix(in srgb,var(--c) 40%,#fff) 100%);transform:translateY(-6px) scale(1.12);box-shadow:0 10px 0 var(--d),0 10px 0 2.5px var(--ink),0 16px 22px color-mix(in srgb,var(--c) 50%,transparent)}
.stile.cur .st-e{animation:wiggle 1.4s ease-in-out infinite}
.stile.cur .st-t{font-size:14px;color:var(--d)}
.stile.cur .st-no{margin-top:8px}
.st-link{flex:0 1 14px;min-width:6px;height:4px;margin-top:28px;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 7px)}

/* 무대 */
.stage{--c:#4DA3FF;--d:#2474D1;position:relative;background:#fff;border:3px solid var(--ink);border-radius:28px;
  box-shadow:0 8px 0 var(--d),0 8px 0 3px var(--ink),0 22px 36px rgba(35,28,61,.18);padding:0;overflow:hidden;animation:stagein .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes stagein{from{transform:perspective(900px) rotateX(-14deg) translateY(20px);opacity:0}}
.stage.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.stage-hd{position:relative;display:flex;align-items:center;gap:16px;padding:20px 20px 18px;border-bottom:3px solid var(--ink);

function josa(s,a,b){const h=hasBatchim(s);return h===null?a+'('+b+')':(h?a:b)}

/* ---------- 저장소 ---------- */
const Store=(()=>{
  let all={},ver=0,key='',pollMs=3000,timer=null,pulling=false,online=true;
  const listeners=new Set();
  const notify=()=>listeners.forEach(f=>{try{f()}catch(e){console.error(e)}});
  const merge=(a,b)=>{for(const k in b){const x=a[k],y=b[k];if(y&&typeof y==='object'&&!Array.isArray(y)&&x&&typeof x==='object'&&!Array.isArray(x))merge(x,y);else a[k]=y}return a};
  /* ---- 체험 모드: 이 브라우저 localStorage ---- */
  const LKEY='odok-db-v1';
  const lload=()=>LS.get(LKEY,{});
  const lsave=()=>{try{localStorage.setItem(LKEY,JSON.stringify(all));return true}catch(e){return false}};
  if(LOCAL)window.addEventListener('storage',e=>{if(e.key===LKEY){all=lload();notify()}});
  function applyLocal(op){
    if(op.op==='set')all[op.path]=clone(op.data);
    else if(op.op==='update')all[op.path]=merge(all[op.path]||{},clone(op.data));
    else if(op.op==='delete')delete all[op.path];
    return{ok:true};
  }
  /* ---- 온라인: Apps Script ---- */
  async function pull(){
    if(LOCAL||pulling)return;pulling=true;
    try{
      const r=await (await fetch(API_URL+'?op=pull&since='+ver+(key?'&key='+encodeURIComponent(key):''),{cache:'no-store'})).json();
      if(!r.ok)throw new Error(r.error||'pull');
      const ks=Object.keys(r.docs||{});
      ks.forEach(p=>{if(r.docs[p]===null)delete all[p];else all[p]=r.docs[p]});
      ver=Math.max(ver,r.ver||0);
      if(!online){online=true;setNet(true)}
      if(ks.length)notify();
    }catch(e){if(online){online=false;setNet(false)}console.warn(e)}
    finally{pulling=false}
  }
  function setNet(ok){const d=$('#netdot');if(d)d.hidden=ok;if(!ok)toast('서버와 연결이 불안정해요. 잠시 후 자동으로 다시 이어져요.')}
  function loop(){clearTimeout(timer);timer=setTimeout(async()=>{await pull();loop()},document.hidden?Math.max(pollMs*4,12000):pollMs)}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!LOCAL){pull();loop()}});
  async function post(body){
    if(LOCAL){
      const res=body.op==='batch'?{ok:true,results:body.ops.map(applyLocal)}:applyLocal(body);
      if(!lsave()){const err=new Error('too_big');err.code='local_full';throw err}
      notify();return res;
    }
    const optimistic=o=>{if(o.op==='set')all[o.path]=clone(o.data);else if(o.op==='update')all[o.path]=merge(all[o.path]||{},clone(o.data));else if(o.op==='delete')delete all[o.path]};
    (body.op==='batch'?body.ops:[body]).forEach(optimistic);notify();
    let r;
    for(let i=0;i<3;i++){
      try{r=await (await fetch(API_URL,{method:'POST',body:JSON.stringify({...body,key})})).json();if(r.ok||r.error!=='busy')break}
      catch(e){r={ok:false,error:'network'}}
      await sleep(600+i*800);
    }
    if(!r||!r.ok){const err=new Error((r&&r.error)||'network');err.code=(r&&r.error)||'network';pull();throw err}
    pull();return r;
  }
  return{
    async init({poll=3000,hostKey=''}={}){pollMs=poll;key=hostKey;if(LOCAL){all=lload();return}await pull();loop()},
    on(fn){listeners.add(fn);return()=>listeners.delete(fn)},
    doc(p){return clone(all[p])},
    peek(p){return all[p]},
    coll(prefix){const out={};const pre=prefix+'/';for(const p in all){if(p.startsWith(pre)&&p.indexOf('/',pre.length)<0)out[p.slice(pre.length)]=all[p]}return out},
    refresh:pull,
    set:(path,data)=>post({op:'set',path,data}),
    update:(path,data)=>post({op:'update',path,data}),
    del:path=>post({op:'delete',path}),
    batch:ops=>post({op:'batch',ops}),
    /* 게스트: 내 기록 불러오기 (이름이 맞을 때만) */
    async mine(path,name){
      if(LOCAL){const d=all[path];if(!d)return{data:null};return d.name===name?{data:clone(d)}:{taken:true}}
      const r=await (await fetch(API_URL+'?op=mine&path='+encodeURIComponent(path)+'&name='+encodeURIComponent(name),{cache:'no-store'})).json();
      if(!r.ok)throw Object.assign(new Error(r.error),{code:r.error});
      return r;
    },
    /* 게스트: 표현 콕콕 파일 올리기 */
    async upload({classId,round,name,mime,dataUrl}){
      if(LOCAL)return{ok:true,url:dataUrl,local:true};
      const data=dataUrl.slice(dataUrl.indexOf(',')+1);
      const r=await (await fetch(API_URL,{method:'POST',body:JSON.stringify({op:'upload',classId,round,name,mime,data})})).json();
      if(!r.ok)throw Object.assign(new Error(r.error),{code:r.error});
      return r;
    }
  };
})();

function normName(v){return String(v||'').trim().replace(/\s+/g,' ').replace(/\s*[(（]\s*/g,'(').replace(/\s*[)）]/g,')')}
function idKey(s){let h1=0x811c9dc5,h2=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0}return h1.toString(36)+h2.toString(36)}

let tiltEl=null;

  if(e.pointerType!=='mouse')return;

function validate(k){
  const s=st(k);
  if(k==='prologue'){if(!T(s.a))return '어떤 내용인지 첫 번째 칸을 채워 주세요.';if(!T(s.b))return '무엇을 말하려는 것 같은지 두 번째 칸을 채워 주세요.'}
  if(k==='words'){const ok=items(k).filter(x=>T(x.w)&&T(x.m));if(!ok.length)return '단어와 뜻을 1개 이상 써 주세요.';if(items(k).some(x=>T(x.w)&&!T(x.m)))return '뜻을 쓰지 않은 단어가 있어요.'}
  if(k==='sentences'){const ok=items(k).filter(x=>T(x.s)&&T(x.r));if(!ok.length)return '문장과 이유를 1개 이상 써 주세요.';if(items(k).some(x=>T(x.s)&&!T(x.r)))return '이유를 쓰지 않은 문장이 있어요.'}
  if(k==='questions'){const ok=items(k).filter(x=>x.cat&&T(x.q));if(!ok.length)return '질문 종류를 고르고 질문을 1개 이상 써 주세요.';if(items(k).some(x=>T(x.q)&&!x.cat))return '종류를 고르지 않은 질문이 있어요.'}
  if(k==='review'){if(!s.stars)return '별점을 눌러 주세요.';if(!T(s.line))return '한 줄 평을 써 주세요.'}
  if(k==='create'){if(!s.kind)return '표현 종류를 골라 주세요.';if(!s.file)return '표현한 파일을 올려 주세요.'}
  return '';
}

async function join(){

  const first=STEPS.findIndex(s=>!stepDone(me,s.k));
  G.step=first<0?STEPS.length-1:first;
  G.view=first<0?'finish':'step';
  pop(r.data?'다시 왔구나!':'오독오독!');
  gRender();window.scrollTo(0,0);
}

function hud(){
  const me=G.me;const n=doneCount(me);const w=gWork();
  return `<header class="ghud">${avatar(me.char,'sm')}<div class="gh-t"><b>${esc(me.name)}</b><small>${esc((gCls()||{}).name||'')} · ${esc(workTitle(w))}</small></div>
    <span id="netdot" class="tag" style="background:var(--coral);color:#fff" hidden>연결 끊김</span>
    <span class="gsave" id="gsave">저장됨 ✓</span>
    <div class="ring" style="--p:${n/STEPS.length*100}"><span>${n}<small>/${STEPS.length}</small></span></div></header>
    <div id="gbanner"></div>`;
}
function stepper(){
  return `<nav class="stepper" aria-label="단계">${STEPS.map((s,i)=>`<button class="stile${i===G.step?' cur':''}${stepDone(G.me,s.k)?' done':''}" style="--c:${s.c};--d:${s.d}" data-g="go" data-i="${i}" aria-current="${i===G.step?'step':'false'}">
      <span class="st-cube"><span class="st-e">${stepDone(G.me,s.k)&&i!==G.step?'✔':s.e}</span></span><span class="st-no">${s.no}</span><span class="st-t">${s.t}</span></button>`).join('<i class="st-link" aria-hidden="true"></i>')}</nav>`;
}
function vStep(){
  const s=STEPS[G.step];
  app.innerHTML=`${DECO}<div class="gwrap">${hud()}${stepper()}
    <section class="stage" style="--c:${s.c};--d:${s.d}" id="stage">
      <div class="stage-hd"><span class="medal spinin"><span>${s.e}</span></span><div><span class="stage-no">${s.no}</span><h1>${s.t}</h1><p>${s.hint}</p></div>${stepDone(G.me,s.k)?'<span class="stamp">제출<br>완료</span>':''}</div>
      <div class="stage-body">${STEP_VIEW[s.k]()}</div>
    </section>
    <div class="gnav">
      ${G.step>0?`<button class="btn big" data-g="prev">◀ 이전</button>`:'<span></span>'}
      <button class="btn big coral nextbtn" data-g="next">${G.step===STEPS.length-1?'제출하고 완주하기 🏁':'저장하고 다음 ▶'}</button>
    </div>
  </div>`;
  checkBanner();
  requestAnimationFrame(()=>{$$('textarea.auto').forEach(autoGrow);
    const sp=$('.stepper'),cur=$('.stile.cur');if(sp&&cur)sp.scrollLeft=cur.offsetLeft-(sp.clientWidth-cur.offsetWidth)/2});
}
function autoGrow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight+4,52)+'px'}
function rmBtn(k,i){return items(k).length>1?`<button class="irm" data-g="rm" data-k="${k}" data-i="${i}" aria-label="지우기" title="지우기">✕</button>`:''}

const STEP_VIEW={
  prologue(){
    const s=st('prologue');const w=gWork();const wt=workTitle(w);
    return `<div class="madlib">
      <div class="ml-line"><span class="ml-work" style="--c:${typeOf(w).c}">${typeOf(w).e} ${esc(wt)}</span><span class="ml-j">${josa(wt,'은','는')}</span></div>
      <textarea class="in ml-in auto" data-f="a" rows="2" maxlength="200" placeholder="어떤 이야기(내용)인가요?">${esc(s.a||'')}</textarea>
      <div class="ml-line"><span class="ml-j">내용이다.</span></div>
      <textarea class="in ml-in auto" data-f="b" rows="2" maxlength="200" placeholder="무엇을 말하고 싶은 걸까요?">${esc(s.b||'')}</textarea>
      <div class="ml-line"><span class="ml-j" id="jb">${josa(s.b,'을','를')} 말하려는 것 같다.</span></div>
    </div>
    <div class="preview"><span class="pv-l">✨ 완성된 한 문장</span><p id="pv">${prologueText()}</p></div>`;
  },
  words(){
    return `<div class="items">${items('words').map((x,i)=>`<div class="icard" style="--i:${i}">
      <span class="inum">${i+1}</span>${rmBtn('words',i)}
      <div class="word-row"><label class="fld grow">단어<input class="in" data-f="w" data-i="${i}" maxlength="30" value="${esc(x.w||'')}" placeholder="모르는 단어"></label>
        <button class="btn sm sky dict" data-g="dict" data-i="${i}" title="표준국어대사전에서 찾기">📘 사전</button></div>
      <label class="fld">뜻<textarea class="in auto" data-f="m" data-i="${i}" rows="2" maxlength="300" placeholder="찾아본 뜻을 써요">${esc(x.m||'')}</textarea></label>
    </div>`).join('')}</div>
    <button class="addbtn" data-g="add" data-k="words"><span>＋</span>추가 단어</button>`;
  },
  sentences(){
    return `<div class="items">${items('sentences').map((x,i)=>`<div class="icard quote-card" style="--i:${i}">
      <span class="inum">${i+1}</span>${rmBtn('sentences',i)}
      <label class="fld">문장<textarea class="in auto q-in" data-f="s" data-i="${i}" rows="2" maxlength="400" placeholder="마음속으로 들어온 문장을 그대로 옮겨 써요">${esc(x.s||'')}</textarea></label>
      <label class="fld">이유<textarea class="in auto" data-f="r" data-i="${i}" rows="2" maxlength="400" placeholder="이 문장이 왜 마음에 들어왔나요?">${esc(x.r||'')}</textarea></label>
    </div>`).join('')}</div>
    <button class="addbtn" data-g="add" data-k="sentences"><span>＋</span>추가 문장</button>`;
  },
  questions(){
    return `<div class="items">${items('questions').map((x,i)=>`<div class="icard" style="--i:${i}">
      <span class="inum">${i+1}</span>${rmBtn('questions',i)}
      <div class="fld">어떤 질문인가요?<div class="qcats">${QCATS.map(q=>`<button class="qcat${x.cat===q.k?' on':''}" style="--c:${q.c}" data-g="cat" data-i="${i}" data-k="${q.k}"><span class="qe">${q.e}</span><b>${q.n}</b><small>${q.s}</small></button>`).join('')}</div></div>
      <label class="fld">질문<textarea class="in auto" data-f="q" data-i="${i}" rows="3" maxlength="400" placeholder="${esc(qHint(x.cat))}">${esc(x.q||'')}</textarea></label>
    </div>`).join('')}</div>
    <button class="addbtn" data-g="add" data-k="questions"><span>＋</span>추가 질문</button>`;
  },
  review(){
    const s=st('review');const n=+s.stars||0;
    return `<div class="review">
      <div class="bigstars" id="bigstars" role="radiogroup" aria-label="별점">${[1,2,3,4,5].map(i=>`<button class="bstar${i<=n?' on':''}" data-g="star" data-n="${i}" role="radio" aria-checked="${i===n}" aria-label="별 ${i}개"><span>★</span></button>`).join('')}</div>
      <div class="star-txt" id="startxt">${n?`${n}점 · ${STAR_TXT[n]}`:'별을 눌러 점수를 매겨요'}</div>
      <label class="fld line-fld">한 줄 평<textarea class="in line-in auto" data-f="line" rows="2" placeholder="이 작품을 한 줄로 평가한다면? (길이 제한 없이 자유롭게)">${esc(s.line||'')}</textarea><span class="cnt" id="linecnt">${(s.line||'').length}자</span></label>
    </div>`;
  },
  create(){
    const s=st('create');const f=s.file;
    return `<div class="create">
      <div class="fld">① 표현 종류 고르기<div class="kinds">${KINDS.map(([k,e])=>`<button class="kind${s.kind===k?' on':''}" data-g="kind" data-k="${esc(k)}"><span>${e}</span>${esc(k)}</button>`).join('')}</div></div>
      <div class="fname"><span class="fn-l">올라갈 파일 이름 <small>(작품_종류_이름 · 자동으로 바뀌어요)</small></span><code id="fname">${esc(fileBase())}<em>.확장자</em></code></div>
      ${f?`<div class="uploaded"><span class="up-e">${KIND_EMO[f.kind]||'📎'}</span><div class="up-t"><b>${esc(f.name)}</b><small>${fmtSize(f.size||0)} · ${new Date(f.at||Date.now()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 올림</small></div>
          <a class="btn sm" href="${esc(f.url)}" target="_blank" rel="noopener" ${String(f.url).startsWith('data:')?`download="${esc(f.name)}"`:''}>열기 ↗</a></div>`:''}
      <label class="drop${G.uploading?' busy':''}" id="drop">
        <input type="file" id="cfile" hidden>
        <span class="drop-e">${G.uploading?'⏳':f?'🔄':'📤'}</span>
        <b>${G.uploading?'올리는 중이에요…':f?'다른 파일로 바꾸기':'② 여기를 눌러 파일 올리기'}</b>
        <small>시 · 수필 · 신문 · 마인드맵 · PPT · 그림 · 영상 등 (최대 ${fmtSize(MAX_FILE)})<br>파일을 끌어다 놓아도 돼요</small>
      </label>
    </div>`;
  }
};
function qHint(cat){return({what:'확인 — 예: ○○이(가) 뜻하는 것은 무엇일까?',why:'의도 — 예: 작가(감독)는 왜 이 장면을 넣었을까?',really:'비판 — 예: ○○의 선택은 정말 옳았을까?',now:'시사 연결 — 예: 지금 우리 사회에서는 이 문제가 어떻게 나타날까?',me:'성찰 — 예: 나라면 이 상황에서 어떻게 했을까?'})[cat]||'먼저 위에서 질문 종류를 골라요'}
function prologueText(){
  const s=st('prologue');const wt=workTitle(gWork());
  const a=T(s.a)?`<u>${esc(T(s.a))}</u>`:'<i>(　　　)</i>';const b=T(s.b)?`<u>${esc(T(s.b))}</u>`:'<i>(　　　)</i>';
  return `<mark>${esc(wt)}</mark>${josa(wt,'은','는')} ${a} 내용이다. ${b}${josa(s.b,'을','를')} 말하려는 것 같다.`;
}
/* 파일 이름: 작품_종류_이름 (예: 소나기_마인드맵_김오독(10203)) */
function fileBase(){const s=st('create');const clean=v=>String(v||'').replace(/[\\/:*?"<>|#%_\s]+/g,'')||'';const w=gWork();return `${clean(w&&w.title)||'작품'}_${clean(s.kind)||'종류'}_${clean(G.me.name)}`}

function vFinish(){
  const me=G.me;const w=gWork();const s=me.steps||{};const rv=s.review||{};
  app.innerHTML=`${DECO}<div class="gwrap">${hud()}
    <div class="finish">
      <div class="trophy"><span>🏆</span></div>
      <h1 class="fin-t">오독오독 완주!</h1>
      <p class="tagline">${esc(me.name)}의 ${esc(workTitle(w))} 읽기 한 상 차림</p>
      <div class="receipt tilt">
        <div class="rc-hd"><b>ODOK·ODOK RECEIPT</b><small>${new Date().toLocaleString('ko-KR')}</small></div>
        <div class="rc-who">${avatar(me.char,"sm")} ${esc(me.name)}</div>
        <p class="rc-pro">${prologueText()}</p>
        <div class="rc-row"><span>🔍 찾은 단어</span><b>${items('words').filter(x=>T(x.w)).length}개</b></div>
        <div class="rc-row"><span>💌 마음에 든 문장</span><b>${items('sentences').filter(x=>T(x.s)).length}개</b></div>
        <div class="rc-row"><span>💬 만든 질문</span><b>${items('questions').filter(x=>T(x.q)).length}개</b></div>
        <div class="rc-row"><span>⭐ 별점</span><b>${starsHTML(+rv.stars||0)}</b></div>
        ${rv.line?`<p class="rc-line">“${esc(rv.line)}”</p>`:''}
        <div class="rc-row"><span>🎨 표현물</span><b>${esc((s.create&&s.create.file&&s.create.file.name)||'-')}</b></div>
        <div class="rc-total"><span>TOTAL</span><b>6 / 6 단계</b></div>
        <div class="rc-bar" aria-hidden="true"></div>
      </div>
      <div class="row" style="justify-content:center"><button class="btn big" data-g="go" data-i="0">✏️ 다시 고치러 가기</button></div>
    </div></div>`;
  checkBanner();
}

/* 호스트가 배포를 바꾸거나 멈추면 알려 줌 */
function checkBanner(){
  const el=$('#gbanner');if(!el||!G.me)return;
  const c=gCls();
  if(c&&c.deploy&&c.deploy.round!==G.me.round){
    const w=S.works[c.deploy.workId];
    el.innerHTML=`<div class="gbanner">📣 호스트가 ${esc(workTitle(w))}을(를) 새로 배포했어요! <button class="btn sm lemon" data-g="rejoin">새로 시작하기</button></div>`;
  }else if(c&&!c.deploy){el.innerHTML='<div class="gbanner off">⏸ 호스트가 배포를 잠시 멈췄어요. 쓴 내용은 저장돼 있어요.</div>'}
  else el.innerHTML='';
}

/* ---------- 동작 ---------- */
function goStep(i){saveNow();G.step=Math.max(0,Math.min(STEPS.length-1,i));G.view='step';vStep();window.scrollTo({top:0,behavior:'smooth'})}
const GACT={
  char(b){G.char=+b.dataset.i;vJoin()},
  rand(){let i;do{i=Math.floor(Math.random()*CHARS.length)}while(i===G.char);G.char=i;vJoin();const a=$('.char-stage .av');a&&a.classList.add('spin')},
  join(){join()},
  go(b){goStep(+b.dataset.i)},
  prev(){goStep(G.step-1)},
  next(){
    const k=STEPS[G.step].k;const err=validate(k);
    if(err){toast(err);const sg=$('#stage');sg.classList.remove('shake');void sg.offsetWidth;sg.classList.add('shake');return}
    const s=st(k);const first=!s.done;s.done=true;s.at=Date.now();
    if(['words','sentences','questions'].includes(k))s.items=items(k).filter(x=>Object.values(x).some(v=>T(v))&&!(k==='questions'&&!T(x.q)));
    saveNow();
    if(G.step===STEPS.length-1||STEPS.every(x=>stepDone(G.me,x.k))){G.view='finish';vFinish();confetti();pop('완주!');window.scrollTo(0,0);return}
    pop(first?pick(['콕!','오독!','좋아!','멋져!','바삭!']):'고쳤어요!');
    goStep(G.step+1);
  },
  add(b){const k=b.dataset.k;items(k).push({});saveSoon();vStep();
    const cards=$$('.icard');const last=cards[cards.length-1];if(last){last.scrollIntoView({block:'center',behavior:'smooth'});const f=last.querySelector('input,textarea');f&&f.focus({preventScroll:true})}},
  rm(b){const k=b.dataset.k;const i=+b.dataset.i;items(k).splice(i,1);touch(k);saveSoon();vStep()},
  cat(b){const i=+b.dataset.i;items('questions')[i].cat=b.dataset.k;touch('questions');saveSoon();
    $$(`.qcat[data-i="${i}"]`).forEach(x=>x.classList.toggle('on',x===b));
    const ta=$(`textarea[data-f="q"][data-i="${i}"]`);if(ta)ta.placeholder=qHint(b.dataset.k)},
  star(b){const n=+b.dataset.n;st('review').stars=n;touch('review');saveSoon();
    $$('.bstar').forEach((x,j)=>{x.classList.toggle('on',j<n);x.setAttribute('aria-checked',j+1===n)});
    b.classList.remove('boing');void b.offsetWidth;b.classList.add('boing');
    $('#startxt').textContent=`${n}점 · ${STAR_TXT[n]}`},
  kind(b){st('create').kind=b.dataset.k;touch('create');saveSoon();$$('.kind').forEach(x=>x.classList.toggle('on',x===b));$('#fname').innerHTML=esc(fileBase())+'<em>.확장자</em>'},
  dict(b){const w=T(items('words')[+b.dataset.i].w);if(!w){toast('먼저 단어를 써 주세요.');return}
    window.open('https://stdict.korean.go.kr/search/searchResult.do?searchKeyword='+encodeURIComponent(w),'_blank','noopener')},
  rejoin(){G.me=null;G.key=null;G.view='join';vJoin();window.scrollTo(0,0)}
};
/* 제출한 뒤 고쳐서 조건이 깨지면 다시 '작성 중'으로 */
function touch(k){const s=st(k);if(s.done&&validate(k))s.done=false}
document.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const f=GACT[b.dataset.g];if(f){e.preventDefault();f(b)}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('textarea.auto'))autoGrow(el);
  const f=el.dataset&&el.dataset.f;if(!f||!G.me)return;
  const k=STEPS[G.step].k;
  if(el.dataset.i!==undefined){const it=items(k)[+el.dataset.i];if(it)it[f]=el.value}
  else st(k)[f]=el.value;
  touch(k);saveSoon();
  if(k==='prologue'){$('#pv').innerHTML=prologueText();if(f==='b')$('#jb').textContent=josa(el.value,'을','를')+' 말하려는 것 같다.'}
  if(k==='review'&&f==='line')$('#linecnt').textContent=el.value.length+'자';
});
document.addEventListener('change',e=>{
  if(e.target.id==='g-cls'){G.cid=e.target.value||null;vJoin()}
  if(e.target.id==='cfile'&&e.target.files[0])uploadFile(e.target.files[0]);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='g-name')){e.preventDefault();join()}});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)uploadFile(f)});

async function uploadFile(file){
  if(G.uploading)return;
  const s=st('create');
  if(!s.kind){toast('먼저 표현 종류를 골라 주세요.');return}
  if(file.size>MAX_FILE){toast(`파일이 너무 커요. ${fmtSize(MAX_FILE)}까지 올릴 수 있어요.`);return}
  const m=file.name.match(/\.([0-9A-Za-z]{1,6})$/);const name=fileBase()+(m?'.'+m[1].toLowerCase():'');
  const c=gCls();
  G.uploading=true;vStep();
  try{
    const dataUrl=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
    const r=await Store.upload({classId:c.id,round:G.me.round,name,mime:file.type||'application/octet-stream',dataUrl});
    s.file={name,url:r.url,id:r.id||'',mime:file.type||'',size:file.size,kind:s.kind,at:Date.now()};
    touch('create');
    G.uploading=false;await saveNow();vStep();pop('업로드!');
  }catch(e){
    G.uploading=false;vStep();
    toast(e&&e.code==='not_deployed'?'배포가 끝난 회차라 올릴 수 없어요.':e&&e.code==='too_big'?'파일이 너무 커요.':'파일을 올리지 못했어요. 다시 시도해 주세요.');
    console.warn(e);
  }
}

/* ---------- 시작 ---------- */
async function startGuest(){
  const h=(location.hash||'').slice(1);
  if(h.startsWith('c-')){G.cid=h.slice(2);G.lockCls=true}
  const saved=LS.get('odok-g-me',{});if(saved&&typeof saved.char==='number'&&(!G.cid||saved.cid===G.cid))G.char=saved.char;
  app.innerHTML=`${DECO}<div class="gwrap join">${hero()}<div class="card waitcard"><span class="wait-emo">🐿️</span><b>불러오는 중…</b></div></div>`;
  await Store.init({poll:4000});
  syncS();gRender();
  Store.on(()=>{syncS();if(G.view==='join'){const a=document.activeElement;if(!(a&&/INPUT|SELECT/.test(a.tagName)))vJoin()}else checkBanner()});
}
startGuest();

</script>
